name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set release version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build signed updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Write latest.json
        env:
          PIAGENT_MANIFEST_VERSION: ${{ github.ref_name }}
          PIAGENT_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          PIAGENT_RELEASE_NOTES: "PiAgent ${{ github.ref_name }}: fixes installed desktop blank screen, backend origins, relative assets, and startup diagnostics."
        run: npm run desktop:latest-json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/PiAgent_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/PiAgent_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
